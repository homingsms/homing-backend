openapi: 3.1.0
info:
  title: Homing Cloud Public API
  version: 1.0.0
  summary: Send and receive SMS, data SMS and MMS through your own Android phones.
  description: |
    The public API used by customer applications and the Homing Cloud web console.

    Authentication:
    - Web console: `POST /auth/sign-in` sets an httpOnly `homing_session` cookie. A session has every scope of its user.
    - Applications: `Authorization: Bearer hk_live_...` with an API key. Each operation lists the scope it needs; `admin` grants every scope.

    Lists use cursor pagination: pass `nextCursor` from a page as `cursor` to get the next page. `nextCursor` is `null` on the last page.

    Every error uses the `Error` shape.
  license:
    name: Proprietary
    identifier: LicenseRef-Homing-Proprietary
  contact:
    name: Homing
    url: https://homingsms.com
servers:
  - url: https://api.homingsms.com/api/v1
    description: Production. Local development serves the same paths at http://localhost:7010/api/v1.
tags:
  - name: Auth
    description: Console sign up, sign in and session.
  - name: Account
    description: Account settings.
  - name: API keys
    description: Scoped API keys for applications.
  - name: Devices
    description: Paired phones, their SIMs and pairing codes.
  - name: Messages
    description: Outgoing SMS, data SMS and MMS.
  - name: Inbox
    description: Messages received by your phones.
  - name: Webhooks
    description: Webhook endpoints, deliveries and test events.
  - name: Usage
    description: Counters for the dashboard.
  - name: Health
    description: Service health.
security:
  - sessionCookie: []
  - apiKey: [admin]
paths:
  /auth/sign-up:
    post:
      tags: [Auth]
      operationId: signUp
      summary: Create an account and its first user
      description: Creates an account with the caller as `owner` and starts a session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Account created and session started.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/sign-in:
    post:
      tags: [Auth]
      operationId: signIn
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignInRequest'
      responses:
        '200':
          description: Session started.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/sign-out:
    post:
      tags: [Auth]
      operationId: signOut
      summary: End the current session
      security:
        - sessionCookie: []
      responses:
        '204':
          description: Session ended and cookie cleared.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Get the signed-in user and account
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /account:
    get:
      tags: [Account]
      operationId: getAccount
      summary: Get account settings
      responses:
        '200':
          description: Account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    patch:
      tags: [Account]
      operationId: updateAccount
      summary: Update account settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        '200':
          description: Updated account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api-keys:
    get:
      tags: [API keys]
      operationId: listApiKeys
      summary: List API keys
      description: Secrets are never returned after creation; only the prefix is shown.
      responses:
        '200':
          description: API keys, newest first, including revoked keys.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [API keys]
      operationId: createApiKey
      summary: Create an API key
      description: The response is the only time the full `secret` is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: API key created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyWithSecret'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api-keys/{apiKeyId}:
    parameters:
      - $ref: '#/components/parameters/ApiKeyId'
    delete:
      tags: [API keys]
      operationId: revokeApiKey
      summary: Revoke an API key
      description: Revocation is immediate and cannot be undone.
      responses:
        '204':
          description: Revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /devices:
    get:
      tags: [Devices]
      operationId: listDevices
      summary: List paired devices
      security:
        - sessionCookie: []
        - apiKey: [devices:manage]
      responses:
        '200':
          description: Devices, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /devices/pairing-codes:
    post:
      tags: [Devices]
      operationId: createPairingCode
      summary: Create a one-time pairing code
      description: The phone enters the code, or scans `pairingUri` as a QR code, to pair with this account.
      security:
        - sessionCookie: []
        - apiKey: [devices:manage]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePairingCodeRequest'
      responses:
        '201':
          description: Pairing code created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PairingCode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /devices/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Devices]
      operationId: getDevice
      summary: Get a device
      security:
        - sessionCookie: []
        - apiKey: [devices:manage]
      responses:
        '200':
          description: Device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Devices]
      operationId: updateDevice
      summary: Rename a device, pause it or change its limits
      description: Limit changes are pushed to the phone as remote settings.
      security:
        - sessionCookie: []
        - apiKey: [devices:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceRequest'
      responses:
        '200':
          description: Updated device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Devices]
      operationId: removeDevice
      summary: Remove a device
      description: Revokes the device token. Messages leased to it go back to the queue.
      security:
        - sessionCookie: []
        - apiKey: [devices:manage]
      responses:
        '204':
          description: Removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /messages:
    post:
      tags: [Messages]
      operationId: sendMessage
      summary: Send an SMS, data SMS or MMS
      description: |
        Queues a message for one recipient. Homing picks an online device and SIM with the
        account's routing strategy unless `deviceId` and `simSlot` are given.

        Send the same `idempotencyKey` again to safely retry: the original message is returned
        with status 200 and `Idempotent-Replayed: true`. Reusing a key with a different body
        returns 409.
      security:
        - sessionCookie: []
        - apiKey: [messages:send]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: Idempotent replay of an earlier request with the same key.
          headers:
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetail'
        '202':
          description: Message accepted and queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    get:
      tags: [Messages]
      operationId: listMessages
      summary: List messages
      security:
        - sessionCookie: []
        - apiKey: [messages:read]
      parameters:
        - name: state
          in: query
          description: Only messages in this state.
          schema:
            $ref: '#/components/schemas/MessageState'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/MessageType'
        - name: deviceId
          in: query
          schema:
            type: string
        - name: to
          in: query
          description: Exact recipient phone number.
          schema:
            $ref: '#/components/schemas/PhoneNumber'
        - $ref: '#/components/parameters/CreatedFrom'
        - $ref: '#/components/parameters/CreatedTo'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Messages, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /messages/{messageId}:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    get:
      tags: [Messages]
      operationId: getMessage
      summary: Get a message with its state timeline
      security:
        - sessionCookie: []
        - apiKey: [messages:read]
      responses:
        '200':
          description: Message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /messages/{messageId}/cancel:
    parameters:
      - $ref: '#/components/parameters/MessageId'
    post:
      tags: [Messages]
      operationId: cancelMessage
      summary: Cancel a message that has not reached the phone's send queue
      description: Allowed in `scheduled`, `pending` and `leased`. Any later state returns 409.
      security:
        - sessionCookie: []
        - apiKey: [messages:send]
      responses:
        '200':
          description: Cancelled message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /inbox:
    get:
      tags: [Inbox]
      operationId: listInbox
      summary: List received messages
      security:
        - sessionCookie: []
        - apiKey: [inbox:read]
      parameters:
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/MessageType'
        - name: deviceId
          in: query
          schema:
            type: string
        - name: from
          in: query
          description: Exact sender.
          schema:
            type: string
            maxLength: 32
        - name: receivedFrom
          in: query
          schema:
            type: string
            format: date-time
        - name: receivedTo
          in: query
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Received messages, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /inbox/{inboxMessageId}:
    parameters:
      - $ref: '#/components/parameters/InboxMessageId'
    get:
      tags: [Inbox]
      operationId: getInboxMessage
      summary: Get a received message
      security:
        - sessionCookie: []
        - apiKey: [inbox:read]
      responses:
        '200':
          description: Received message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /inbox/{inboxMessageId}/attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/InboxMessageId'
      - name: attachmentId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Inbox]
      operationId: getInboxAttachment
      summary: Download an MMS attachment
      security:
        - sessionCookie: []
        - apiKey: [inbox:read]
      responses:
        '200':
          description: Raw attachment bytes with their original content type.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /webhooks:
    get:
      tags: [Webhooks]
      operationId: listWebhooks
      summary: List webhook endpoints
      security:
        - sessionCookie: []
        - apiKey: [webhooks:manage]
      responses:
        '200':
          description: Endpoints, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Webhooks]
      operationId: createWebhook
      summary: Create a webhook endpoint
      description: The response is the only time the signing `secret` is returned until it is rotated.
      security:
        - sessionCookie: []
        - apiKey: [webhooks:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookRequest'
      responses:
        '201':
          description: Endpoint created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointWithSecret'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /webhooks/{webhookId}:
    parameters:
      - $ref: '#/components/parameters/WebhookId'
    get:
      tags: [Webhooks]
      operationId: getWebhook
      summary: Get a webhook endpoint
      security:
        - sessionCookie: []
        - apiKey: [webhooks:manage]
      responses:
        '200':
          description: Endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Webhooks]
      operationId: updateWebhook
      summary: Update a webhook endpoint
      security:
        - sessionCookie: []
        - apiKey: [webhooks:manage]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWebhookRequest'
      responses:
        '200':
          description: Updated endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpoint'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Webhooks]
      operationId: deleteWebhook
      summary: Delete a webhook endpoint
      security:
        - sessionCookie: []
        - apiKey: [webhooks:manage]
      responses:
        '204':
          description: Deleted with its delivery log.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /webhooks/{webhookId}/rotate-secret:
    parameters:
      - $ref: '#/components/parameters/WebhookId'
    post:
      tags: [Webhooks]
      operationId: rotateWebhookSecret
      summary: Replace the signing secret
      description: The old secret stops working immediately.
      security:
        - sessionCookie: []
        - apiKey: [webhooks:manage]
      responses:
        '200':
          description: New secret.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSecret'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /webhooks/{webhookId}/test:
    parameters:
      - $ref: '#/components/parameters/WebhookId'
    post:
      tags: [Webhooks]
      operationId: sendWebhookTest
      summary: Send a `webhook.test` event to this endpoint
      security:
        - sessionCookie: []
        - apiKey: [webhooks:manage]
      responses:
        '202':
          description: Test delivery queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDelivery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /webhooks/{webhookId}/deliveries:
    parameters:
      - $ref: '#/components/parameters/WebhookId'
    get:
      tags: [Webhooks]
      operationId: listWebhookDeliveries
      summary: List the delivery log of an endpoint
      security:
        - sessionCookie: []
        - apiKey: [webhooks:manage]
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/WebhookDeliveryStatus'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Deliveries, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /webhooks/{webhookId}/deliveries/{deliveryId}/redeliver:
    parameters:
      - $ref: '#/components/parameters/WebhookId'
      - name: deliveryId
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Webhooks]
      operationId: redeliverWebhook
      summary: Send a delivery again
      description: Resets the attempt counter and sends the original event with a fresh signature.
      security:
        - sessionCookie: []
        - apiKey: [webhooks:manage]
      responses:
        '202':
          description: Redelivery queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDelivery'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /usage/summary:
    get:
      tags: [Usage]
      operationId: getUsageSummary
      summary: Today's counters, queue depth and devices online
      security:
        - sessionCookie: []
        - apiKey: [messages:read]
      responses:
        '200':
          description: Summary. Days are UTC.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /usage/daily:
    get:
      tags: [Usage]
      operationId: getDailyUsage
      summary: Sent, delivered, failed and received per day
      security:
        - sessionCookie: []
        - apiKey: [messages:read]
      parameters:
        - $ref: '#/components/parameters/UsageFrom'
        - $ref: '#/components/parameters/UsageTo'
        - name: deviceId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: One row per UTC day in the range, including days with zero activity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyUsageList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /usage/devices:
    get:
      tags: [Usage]
      operationId: getDeviceUsage
      summary: Sent, delivered, failed and received per device
      security:
        - sessionCookie: []
        - apiKey: [messages:read]
      parameters:
        - $ref: '#/components/parameters/UsageFrom'
        - $ref: '#/components/parameters/UsageTo'
      responses:
        '200':
          description: One row per current device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceUsageList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Service health
      security: []
      responses:
        '200':
          description: Healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          description: A dependency is down.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
webhooks:
  message.sent:
