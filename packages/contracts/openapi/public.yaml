components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: homing_session
      description: httpOnly session cookie set by sign up and sign in. Has every scope.
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: hk_live_<secret>
      description: |
        API key created in the console. Scopes: `messages:send`, `messages:read`, `inbox:read`,
        `webhooks:manage`, `devices:manage`, `admin`. `admin` grants every scope.
  headers:
    SetSessionCookie:
      description: '`homing_session=<token>; HttpOnly; Secure; SameSite=Lax; Path=/`'
      schema:
        type: string
    IdempotentReplayed:
      description: Present and `true` when the response is a replay.
      schema:
        type: string
        const: 'true'
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
  parameters:
    ApiKeyId:
      name: apiKeyId
      in: path
      required: true
      schema:
        type: string
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
    InboxMessageId:
      name: inboxMessageId
      in: path
      required: true
      schema:
        type: string
    WebhookId:
      name: webhookId
      in: path
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from `nextCursor` of the previous page.
      schema:
        type: string
        maxLength: 200
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    CreatedFrom:
      name: createdFrom
      in: query
      description: Inclusive lower bound on `createdAt`.
      schema:
        type: string
        format: date-time
    CreatedTo:
      name: createdTo
      in: query
      description: Exclusive upper bound on `createdAt`.
      schema:
        type: string
        format: date-time
    UsageFrom:
      name: from
      in: query
      required: true
      description: First UTC day, inclusive.
      schema:
        type: string
        format: date
    UsageTo:
      name: to
      in: query
      required: true
      description: Last UTC day, inclusive. At most 92 days after `from`.
      schema:
        type: string
        format: date
    SignatureHeader:
      name: Homing-Signature
      in: header
      required: true
      description: '`t=<unix seconds>,v1=<hex HMAC-SHA256 of "<t>.<raw body>">`. See WEBHOOKS.md.'
      schema:
        type: string
    EventIdHeader:
      name: Homing-Event-Id
      in: header
      required: true
      schema:
        type: string
    EventTypeHeader:
      name: Homing-Event-Type
      in: header
      required: true
      schema:
        $ref: '#/components/schemas/WebhookEventType'
  responses:
    BadRequest:
      description: The request is malformed or failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, expired or invalid credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The credentials lack the required scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The resource does not exist in this account.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The request conflicts with the current state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: The request body is too large.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [statusCode, message, error, timestamp, path]
      properties:
        statusCode:
          type: integer
          examples: [400]
        message:
          description: Human readable reason, or a list of validation errors.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
          examples: [Bad Request]
        timestamp:
          type: string
          format: date-time
        path:
          type: string
          examples: [/api/v1/messages]
    Scope:
      type: string
      enum: [messages:send, messages:read, inbox:read, webhooks:manage, devices:manage, admin]
    PhoneNumber:
      type: string
      description: E.164 number such as `+2348012345678`, or a short code.
      pattern: '^\+?[0-9]{3,15}$'
      examples: ['+2348012345678']
    Timestamp:
      type: string
      format: date-time
    User:
      type: object
      required: [id, email, name, role, createdAt]
      properties:
        id:
          type: string
          examples: [usr_V1StGXR8Z5jdHi6BmyT]
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [owner, member]
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    RoutingStrategy:
      type: string
      description: How messages without `deviceId` are spread across online devices.
      enum: [round_robin, least_used]
    Account:
      type: object
      required: [id, name, routingStrategy, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        routingStrategy:
          $ref: '#/components/schemas/RoutingStrategy'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    Session:
      type: object
      required: [user, account]
      properties:
        user:
          $ref: '#/components/schemas/User'
        account:
          $ref: '#/components/schemas/Account'
    SignUpRequest:
      type: object
      additionalProperties: false
      required: [email, password, name]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
        name:
          type: string
          minLength: 1
          maxLength: 100
        accountName:
          type: string
          minLength: 1
          maxLength: 100
          description: Defaults to the user's name.
    SignInRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
    UpdateAccountRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        routingStrategy:
          $ref: '#/components/schemas/RoutingStrategy'
    ApiKey:
      type: object
      required: [id, name, prefix, scopes, createdAt, lastUsedAt, expiresAt, revokedAt]
      properties:
        id:
          type: string
        name:
          type: string
        prefix:
          type: string
          description: First characters of the secret, for recognising the key.
          examples: [hk_live_V1StGX]
        scopes:
          type: array
          items:
            $ref: '#/components/schemas/Scope'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        lastUsedAt:
          type: [string, 'null']
          format: date-time
        expiresAt:
          type: [string, 'null']
          format: date-time
        revokedAt:
          type: [string, 'null']
          format: date-time
    ApiKeyWithSecret:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              description: The full key. Store it now; it is never shown again.
              examples: [hk_live_V1StGXR8Z5jdHi6BmyTq2nB7xKp0LwEa]
    ApiKeyList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'
    CreateApiKeyRequest:
      type: object
      additionalProperties: false
      required: [name, scopes]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Scope'
        expiresAt:
          type: string
          format: date-time
          description: Optional expiry in the future.
    DeviceStatus:
      type: string
      description: '`online` while heartbeats arrive; `offline` after missing them.'
      enum: [online, offline]
    NetworkType:
      type: string
      enum: [wifi, cellular, ethernet, none, unknown]
    Sim:
      type: object
      required: [slot, carrier, phoneNumber, signalLevel, enabled, dailyLimit, sentToday]
      properties:
        slot:
          type: integer
          minimum: 0
          maximum: 7
        carrier:
          type: [string, 'null']
        phoneNumber:
          type: [string, 'null']
        signalLevel:
          type: [integer, 'null']
          minimum: 0
          maximum: 4
        enabled:
          type: boolean
          description: Disabled SIMs are never picked for sending.
        dailyLimit:
          type: [integer, 'null']
          minimum: 1
          description: Maximum messages per UTC day on this SIM. `null` means no cap.
        sentToday:
          type: integer
          minimum: 0
    DeviceHealth:
      type: object
      required: [batteryLevel, charging, networkType, reportedAt]
      properties:
        batteryLevel:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
        charging:
          type: [boolean, 'null']
        networkType:
          $ref: '#/components/schemas/NetworkType'
        reportedAt:
          $ref: '#/components/schemas/Timestamp'
    Device:
      type: object
      required: [id, name, status, paused, model, manufacturer, osVersion, appVersion, dailyLimit, sentToday, lastSeenAt, health, sims, createdAt]
      properties:
        id:
          type: string
          examples: [dev_4f90d13a42]
        name:
          type: string
        status:
          $ref: '#/components/schemas/DeviceStatus'
        paused:
          type: boolean
          description: Paused devices keep receiving but are never picked for sending.
        model:
          type: [string, 'null']
        manufacturer:
          type: [string, 'null']
        osVersion:
          type: [string, 'null']
        appVersion:
          type: [string, 'null']
        dailyLimit:
          type: [integer, 'null']
          minimum: 1
          description: Maximum messages per UTC day across all SIMs. `null` means no cap.
        sentToday:
          type: integer
          minimum: 0
        lastSeenAt:
          type: [string, 'null']
          format: date-time
        health:
          oneOf:
            - $ref: '#/components/schemas/DeviceHealth'
            - type: 'null'
        sims:
          type: array
          items:
            $ref: '#/components/schemas/Sim'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    DeviceList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Device'
    SimSettingsInput:
      type: object
      additionalProperties: false
      required: [slot]
      properties:
        slot:
          type: integer
          minimum: 0
          maximum: 7
        enabled:
          type: boolean
        dailyLimit:
          type: [integer, 'null']
          minimum: 1
          maximum: 100000
    UpdateDeviceRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        paused:
          type: boolean
        dailyLimit:
          type: [integer, 'null']
          minimum: 1
          maximum: 100000
        sims:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/SimSettingsInput'
    CreatePairingCodeRequest:
      type: object
      additionalProperties: false
      properties:
        deviceName:
          type: string
          minLength: 1
          maxLength: 100
          description: Name given to the device when it pairs. The phone may override it.
    PairingCode:
      type: object
      required: [code, expiresAt, pairingUri]
      properties:
        code:
          type: string
          description: Single-use code the phone types in. Valid for 10 minutes.
          examples: [K7PM-4XQ2]
        expiresAt:
          $ref: '#/components/schemas/Timestamp'
        pairingUri:
          type: string
          description: Encode as a QR code for the app to scan.
          examples: ['homing://pair?server=https%3A%2F%2Fapi.homingsms.com&code=K7PM-4XQ2']
    MessageType:
      type: string
      enum: [sms, data, mms]
    MessageState:
      type: string
      description: |
        `scheduled` waits for `scheduleAt`. `pending` waits in the cloud queue. `leased` was pulled by a
        device. `queued` is in the phone's send queue. `sending`, `sent` and `delivered` follow the
        carrier. `failed`, `cancelled`, `expired` and `delivered` are final.
      enum: [scheduled, pending, leased, queued, sending, sent, delivered, failed, cancelled, expired]
    MessagePriority:
      type: string
      description: '`otp` messages jump ahead of `normal` traffic on every device.'
      enum: [normal, otp]
    Metadata:
      type: object
      description: Up to 20 string pairs of your own, returned on the message and its webhooks.
      maxProperties: 20
      additionalProperties:
        type: string
        maxLength: 500
    SendMessageOptions:
      type: object
      required: [to]
      properties:
        to:
          $ref: '#/components/schemas/PhoneNumber'
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 128
          description: Unique per account. Retrying with the same key never sends twice.
        deviceId:
          type: string
          description: Send from this device only. Without it Homing routes the message.
        simSlot:
          type: integer
          minimum: 0
          maximum: 7
          description: Send from this SIM slot. Requires `deviceId`.
        scheduleAt:
          type: string
          format: date-time
          description: Hold the message until this time.
        validUntil:
          type: string
          format: date-time
          description: Expire the message if it has not reached a phone by this time.
        priority:
          $ref: '#/components/schemas/MessagePriority'
        deliveryReport:
          type: boolean
          default: true
          description: Ask the carrier for a delivery report.
        metadata:
          $ref: '#/components/schemas/Metadata'
    SendSmsRequest:
      allOf:
        - $ref: '#/components/schemas/SendMessageOptions'
        - type: object
          required: [type, text]
          properties:
            type:
              type: string
              const: sms
            text:
              type: string
              minLength: 1
              maxLength: 1600
              description: Long texts are split into parts by the phone.
    SendDataSmsRequest:
      allOf:
        - $ref: '#/components/schemas/SendMessageOptions'
        - type: object
          required: [type, data, port]
          properties:
            type:
              type: string
              const: data
            data:
              type: string
              contentEncoding: base64
              minLength: 1
              maxLength: 188
              description: Base64 payload, at most 140 bytes decoded.
            port:
              type: integer
              minimum: 1
              maximum: 65535
    MessageAttachmentInput:
      type: object
      additionalProperties: false
      required: [contentType, data]
      properties:
        contentType:
          type: string
          maxLength: 100
          examples: [image/jpeg]
        name:
          type: string
          maxLength: 255
        data:
          type: string
          contentEncoding: base64
          description: Base64 bytes. All attachments together may be at most 1 MiB decoded.
    SendMmsRequest:
      allOf:
        - $ref: '#/components/schemas/SendMessageOptions'
        - type: object
          required: [type]
          properties:
            type:
              type: string
              const: mms
            subject:
              type: string
              maxLength: 80
            text:
              type: string
              maxLength: 1600
            attachments:
              type: array
              maxItems: 10
              items:
                $ref: '#/components/schemas/MessageAttachmentInput'
          description: Needs `text` or at least one attachment.
    SendMessageRequest:
      oneOf:
        - $ref: '#/components/schemas/SendSmsRequest'
        - $ref: '#/components/schemas/SendDataSmsRequest'
        - $ref: '#/components/schemas/SendMmsRequest'
    MessageAttachment:
      type: object
      required: [id, contentType, name, size]
      properties:
        id:
          type: string
        contentType:
          type: string
        name:
          type: [string, 'null']
        size:
          type: integer
          description: Bytes.
    MessageError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable code such as `generic_failure`, `no_service`, `radio_off`, `lease_expired`, `invalid_recipient`.
        message:
          type: string
    Message:
      type: object
      required: [id, type, to, text, data, port, subject, attachments, state, priority, deviceId, simSlot, idempotencyKey, scheduleAt, validUntil, deliveryReport, metadata, attempts, partsCount, error, createdAt, updatedAt, sentAt, deliveredAt, failedAt]
      properties:
        id:
          type: string
          examples: [msg_V1StGXR8Z5jdHi6BmyT]
        type:
          $ref: '#/components/schemas/MessageType'
        to:
          $ref: '#/components/schemas/PhoneNumber'
        text:
          type: [string, 'null']
        data:
          type: [string, 'null']
          contentEncoding: base64
        port:
          type: [integer, 'null']
        subject:
          type: [string, 'null']
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/MessageAttachment'
        state:
          $ref: '#/components/schemas/MessageState'
        priority:
          $ref: '#/components/schemas/MessagePriority'
        deviceId:
          type: [string, 'null']
          description: Device the message is routed or leased to.
        simSlot:
          type: [integer, 'null']
        idempotencyKey:
          type: [string, 'null']
        scheduleAt:
          type: [string, 'null']
          format: date-time
        validUntil:
          type: [string, 'null']
          format: date-time
        deliveryReport:
          type: boolean
        metadata:
          $ref: '#/components/schemas/Metadata'
        attempts:
          type: integer
          description: Number of times a device leased the message.
        partsCount:
          type: [integer, 'null']
        error:
          oneOf:
            - $ref: '#/components/schemas/MessageError'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
        sentAt:
          type: [string, 'null']
          format: date-time
        deliveredAt:
          type: [string, 'null']
          format: date-time
        failedAt:
          type: [string, 'null']
          format: date-time
    MessageEvent:
      type: object
      required: [state, at, deviceId, simSlot, error]
      properties:
        state:
          $ref: '#/components/schemas/MessageState'
        at:
          $ref: '#/components/schemas/Timestamp'
        deviceId:
          type: [string, 'null']
        simSlot:
          type: [integer, 'null']
        error:
          oneOf:
            - $ref: '#/components/schemas/MessageError'
            - type: 'null'
    MessageDetail:
      allOf:
        - $ref: '#/components/schemas/Message'
        - type: object
          required: [events]
          properties:
            events:
              type: array
              description: State timeline, oldest first.
              items:
                $ref: '#/components/schemas/MessageEvent'
    MessagePage:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        nextCursor:
          type: [string, 'null']
    InboxAttachment:
      type: object
      required: [id, contentType, name, size]
      properties:
        id:
          type: string
        contentType:
          type: string
        name:
          type: [string, 'null']
        size:
          type: integer
    InboxMessage:
      type: object
      required: [id, type, from, to, deviceId, simSlot, text, data, port, subject, attachments, receivedAt, createdAt]
      properties:
        id:
          type: string
          examples: [inb_V1StGXR8Z5jdHi6BmyT]
        type:
          $ref: '#/components/schemas/MessageType'
        from:
          type: string
          description: Sender number or alphanumeric sender ID.
        to:
          type: [string, 'null']
          description: The receiving SIM's number when the phone knows it.
        deviceId:
          type: [string, 'null']
        simSlot:
          type: [integer, 'null']
        text:
          type: [string, 'null']
        data:
          type: [string, 'null']
          contentEncoding: base64
        port:
          type: [integer, 'null']
        subject:
          type: [string, 'null']
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/InboxAttachment'
        receivedAt:
          $ref: '#/components/schemas/Timestamp'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
    InboxPage:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/InboxMessage'
        nextCursor:
          type: [string, 'null']
    WebhookEventType:
      type: string
      enum: [message.sent, message.delivered, message.failed, inbox.received, device.online, device.offline, opt_out.received, webhook.test]
    SubscribableEventType:
      type: string
      enum: [message.sent, message.delivered, message.failed, inbox.received, device.online, device.offline, opt_out.received]
    WebhookEndpoint:
      type: object
      required: [id, url, description, events, enabled, createdAt, updatedAt]
      properties:
        id:
          type: string
          examples: [whk_V1StGXR8Z5jdHi6BmyT]
        url:
          type: string
          format: uri
        description:
          type: [string, 'null']
        events:
          type: array
          items:
            $ref: '#/components/schemas/SubscribableEventType'
        enabled:
          type: boolean
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    WebhookEndpointWithSecret:
      allOf:
        - $ref: '#/components/schemas/WebhookEndpoint'
        - type: object
          required: [secret]
          properties:
            secret:
              type: string
              examples: [whsec_3fQ1x9Lk2mN8pR4tV6yB0cD5]
    WebhookEndpointList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEndpoint'
    CreateWebhookRequest:
      type: object
      additionalProperties: false
      required: [url, events]
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
          description: HTTPS URL. Plain HTTP is accepted only when the server allows it in development.
        events:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SubscribableEventType'
        description:
          type: string
          maxLength: 200
        enabled:
          type: boolean
          default: true
    UpdateWebhookRequest:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          maxLength: 2048
        events:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/SubscribableEventType'
        description:
          type: [string, 'null']
          maxLength: 200
        enabled:
          type: boolean
    WebhookSecret:
      type: object
      required: [secret]
      properties:
        secret:
          type: string
    WebhookDeliveryStatus:
      type: string
      description: '`retrying` has failed at least once and has attempts left.'
      enum: [pending, retrying, succeeded, failed]
    WebhookDelivery:
      type: object
      required: [id, endpointId, eventId, eventType, status, attempts, lastStatusCode, lastResponseBody, lastError, nextAttemptAt, deliveredAt, createdAt, updatedAt]
      properties:
        id:
          type: string
          examples: [whd_V1StGXR8Z5jdHi6BmyT]
        endpointId:
          type: string
        eventId:
          type: string
        eventType:
          $ref: '#/components/schemas/WebhookEventType'
        status:
          $ref: '#/components/schemas/WebhookDeliveryStatus'
        attempts:
          type: integer
        lastStatusCode:
          type: [integer, 'null']
        lastResponseBody:
          type: [string, 'null']
          description: First 1 KiB of the last response body.
        lastError:
          type: [string, 'null']
          description: Network or timeout error of the last attempt.
        nextAttemptAt:
          type: [string, 'null']
          format: date-time
        deliveredAt:
          type: [string, 'null']
          format: date-time
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        updatedAt:
          $ref: '#/components/schemas/Timestamp'
    WebhookDeliveryPage:
      type: object
      required: [data, nextCursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/WebhookDelivery'
        nextCursor:
          type: [string, 'null']
    UsageCounts:
      type: object
      required: [sent, delivered, failed, received]
      properties:
        sent:
          type: integer
        delivered:
          type: integer
        failed:
          type: integer
        received:
          type: integer
    UsageSummary:
      type: object
      required: [today, queue, devices]
      properties:
        today:
          $ref: '#/components/schemas/UsageCounts'
        queue:
          type: object
          required: [scheduled, pending, inFlight]
          properties:
            scheduled:
              type: integer
            pending:
              type: integer
            inFlight:
              type: integer
              description: Messages in `leased`, `queued` or `sending`.
        devices:
          type: object
          required: [online, total]
          properties:
            online:
              type: integer
            total:
              type: integer
    DailyUsage:
      allOf:
        - type: object
          required: [date]
          properties:
            date:
              type: string
              format: date
        - $ref: '#/components/schemas/UsageCounts'
    DailyUsageList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DailyUsage'
    DeviceUsage:
      allOf:
        - type: object
          required: [deviceId, deviceName]
          properties:
            deviceId:
              type: string
            deviceName:
              type: string
        - $ref: '#/components/schemas/UsageCounts'
    DeviceUsageList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/DeviceUsage'
    Health:
      type: object
      required: [status, version, time, checks]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
        time:
          $ref: '#/components/schemas/Timestamp'
        checks:
          type: object
          required: [database, redis]
          properties:
            database:
              type: string
              enum: [up, down]
            redis:
              type: string
              enum: [up, down]
    WebhookEventEnvelope:
      type: object
      required: [id, type, createdAt, accountId, data]
      properties:
        id:
          type: string
          description: Unique event ID. Use it to ignore duplicates.
          examples: [evt_V1StGXR8Z5jdHi6BmyT]
        type:
          $ref: '#/components/schemas/WebhookEventType'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        accountId:
          type: string
        data:
          type: object
    MessageWebhookEvent:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              enum: [message.sent, message.delivered, message.failed]
            data:
              type: object
              required: [message]
              properties:
                message:
                  $ref: '#/components/schemas/Message'
    InboxWebhookEvent:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              const: inbox.received
            data:
              type: object
              required: [message]
              properties:
                message:
                  $ref: '#/components/schemas/InboxMessage'
    DeviceWebhookEvent:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              enum: [device.online, device.offline]
            data:
              type: object
              required: [device]
              properties:
                device:
                  type: object
                  required: [id, name, status, lastSeenAt]
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    status:
                      $ref: '#/components/schemas/DeviceStatus'
                    lastSeenAt:
                      type: [string, 'null']
                      format: date-time
    OptOutWebhookEvent:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              const: opt_out.received
            data:
              type: object
              required: [phoneNumber, keyword, inboxMessageId, deviceId, receivedAt]
              properties:
                phoneNumber:
                  type: string
                keyword:
                  type: string
                  examples: [STOP]
                inboxMessageId:
                  type: string
                deviceId:
                  type: [string, 'null']
                receivedAt:
                  $ref: '#/components/schemas/Timestamp'
    TestWebhookEvent:
      allOf:
        - $ref: '#/components/schemas/WebhookEventEnvelope'
        - type: object
          required: [type, data]
          properties:
            type:
              type: string
              const: webhook.test
            data:
              type: object
              required: [endpointId, message]
              properties:
                endpointId:
                  type: string
                message:
                  type: string
