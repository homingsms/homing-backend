name: homing-backend

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: homing
      POSTGRES_PASSWORD: homing
      POSTGRES_DB: homing_dev
    ports:
      - '54329:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U homing -d homing_dev']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '63799:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
