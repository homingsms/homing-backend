name: backend

on:
  push:
    branches: [backend]
  pull_request:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: homing
          POSTGRES_PASSWORD: homing
          POSTGRES_DB: homing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U homing -d homing_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://homing:homing@localhost:5432/homing_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.28.11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Contracts lint
        run: pnpm --filter @homing/contracts lint

      - name: Contracts typecheck
        run: pnpm --filter @homing/contracts typecheck

      - name: Contracts generated types are current
        run: pnpm --filter @homing/contracts check:generated

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: E2E tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

      - name: Docker image builds
        run: docker build --tag homing-cloud:ci .
